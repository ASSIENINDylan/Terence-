<script>
"use strict";
/* ============================================================================
   SHADOW OF THE WARRIOR — v2
   Rendu avancé (dégradés, lumières, particules), carte ouverte, donjon,
   marchands, et système de 3 classes évoluant en 9 voies au niveau 5.
   Effets des stats : FORCE -> armure & dégâts · VITESSE -> esquive & double
   frappe & fuite · ESPRIT -> puissance magique & énergie.
   ========================================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === "number") r = {tl:r, tr:r, br:r, bl:r};
    else r = {tl:r[0]||0, tr:r[1]||0, br:r[2]||0, bl:r[3]||0};
    this.moveTo(x + r.tl, y);
    this.arcTo(x + w, y, x + w, y + h, r.tr);
    this.arcTo(x + w, y + h, x, y + h, r.br);
    this.arcTo(x, y + h, x, y, r.bl);
    this.arcTo(x, y, x + w, y, r.tl);
    this.closePath();
    return this;
  };
}

/* -------------------------------- ENTRÉES -------------------------------- */
const keys = {};
const justPressed = {};
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (!keys[k]) justPressed[k] = true;
  keys[k] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
function pressed(){ for (let i=0;i<arguments.length;i++) if (justPressed[arguments[i]]) return true; return false; }
function held(){ for (let i=0;i<arguments.length;i++) if (keys[arguments[i]]) return true; return false; }
function clearJustPressed(){ for (const k in justPressed) delete justPressed[k]; }

/* --------------------------- HELPERS DE DESSIN ---------------------------- */
function linGrad(x0,y0,x1,y1,stops){
  const g = ctx.createLinearGradient(x0,y0,x1,y1);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
function rrFill(x,y,w,h,r,fill){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  ctx.fillStyle = fill; ctx.fill();
}
function rrStroke(x,y,w,h,r,stroke,lw){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  ctx.strokeStyle = stroke; ctx.lineWidth = lw||1; ctx.stroke();
}
function txt(t,x,y,size,color,align,font,noShadow){
  ctx.textAlign = align||"left";
  const f = font || "Georgia, serif";
  ctx.font = (f.indexOf("px") !== -1) ? f : size + "px " + f;
  if (!noShadow){ ctx.fillStyle = "rgba(0,0,0,0.75)"; ctx.fillText(t, x+1.2, y+1.2); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function wrapTxt(t,x,y,maxW,lh,size,color,align){
  ctx.font = size + "px Georgia, serif";
  const words = t.split(" ");
  let line = "", cy = y;
  for (const w of words){
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line){
      txt(line, x, cy, size, color, align); line = w; cy += lh;
    } else line = test;
  }
  if (line) txt(line, x, cy, size, color, align);
  return cy;
}
function barre(x,y,w,h,ratio,c1,c2){
  ratio = Math.max(0, Math.min(1, ratio));
  rrFill(x,y,w,h,h/2, "rgba(0,0,0,0.6)");
  if (ratio > 0.01){
    rrFill(x+1.5,y+1.5,Math.max(2,(w-3)*ratio),h-3,(h-3)/2, linGrad(x,y,x,y+h,[[0,c1],[1,c2]]));
    rrFill(x+3,y+2.5,Math.max(1,(w-6)*ratio),Math.max(1,h*0.22),1,"rgba(255,255,255,0.28)");
  }
  rrStroke(x,y,w,h,h/2,"rgba(0,0,0,0.85)",1);
}
function panel(x,y,w,h){
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.65)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
  rrFill(x,y,w,h,10, linGrad(x,y,x,y+h,[[0,"rgba(26,29,41,0.97)"],[1,"rgba(11,13,19,0.97)"]]));
  ctx.restore();
  rrStroke(x+1.5,y+1.5,w-3,h-3,9,"rgba(216,180,90,0.6)",1.5);
  rrStroke(x+5,y+5,w-10,h-10,6,"rgba(216,180,90,0.18)",1);
}
function shade(hex,f){
  const r = Math.round(parseInt(hex.slice(1,3),16)*f);
  const g = Math.round(parseInt(hex.slice(3,5),16)*f);
  const b = Math.round(parseInt(hex.slice(5,7),16)*f);
  return "rgb(" + Math.min(255,r) + "," + Math.min(255,g) + "," + Math.min(255,b) + ")";
}

/* ------------------------ PARTICULES & TEXTES FLOTTANTS ------------------- */
let parts = [];
function spawnParts(x,y,color,n,spd,life,grav){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (0.4+Math.random()*0.8)*spd;
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life*(0.6+Math.random()*0.6),
      max:life,color:color,size:1.5+Math.random()*2.5,grav:grav||0});
  }
}
function drawParts(){
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--;
    if (p.life <= 0){ parts.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
let floats = [];
function addFloat(x,y,t,color,size){
  floats.push({x:x+(Math.random()*16-8), y:y, t:t, color:color, size:size||14, life:55, max:55});
}
function drawFloats(){
  for (let i=floats.length-1;i>=0;i--){
    const f = floats[i];
    f.y -= 0.75; f.life--;
    if (f.life <= 0){ floats.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, f.life/25);
    txt(f.t, f.x, f.y, f.size, f.color, "center", "bold " + f.size + "px Georgia");
  }
  ctx.globalAlpha = 1;
}
let shake = 0;

/* ================================= JOUEUR ================================= */
const player = {
  x:400, y:440, w:20, h:26, dir:"down", moving:false, animTime:0,

function newGame(cls){

/* --------------------- STATS DÉRIVÉES (EFFETS SPÉCIAUX) ------------------- */
let combat = null;
function buffVal(k){
  return (combat && combat.buff) ? (combat.buff[k]||0) : 0;
}
function armureTotale(){ return player.armure.defense + Math.floor(player.force*0.6) + buffVal("armure"); }
function esquivePct(){ return Math.min(70, Math.round(player.vitesse*2.2) + buffVal("esquive")); }
function degatsAttaque(){ return player.degatsBase + player.arme.degats + Math.floor((player.force+buffVal("force"))*0.5); }
function doubleChance(){ return Math.min(25, Math.round(player.vitesse*1.2)); }
function energieMax(){ return 50 + player.esprit*5; }
function capaciteActuelle(){ return player.evolution ? player.evolution.capacite : player.classe.capacite; }
function nomClasse(){ return player.evolution ? player.evolution.nom : (player.classe ? player.classe.nom : "?"); }
function couleurClasse(){ return player.evolution ? player.evolution.couleur : (player.classe ? player.classe.couleur : "#888"); }

function log(m){ combatLog.push(m); if (combatLog.length > 5) combatLog.shift(); }

let shop = null, flashShop = "", flashTimer = 0;
function acheter(item){
  if (player.or < item.prix){ flashShop = "Pas assez d'or !"; flashTimer = 90; return; }
  player.or -= item.prix;
  switch(item.type){
    case "potion":  player.potions++; break;
    case "force":   player.force++; break;
    case "vitesse": player.vitesse++; break;
    case "esprit":  player.esprit++; break;
    case "pvmax":   player.pvMax += 10; player.pv += 10; break;
    case "arme":    player.arme = { nom:item.nom, degats:item.degats }; break;
    case "armure":  player.armure = { nom:item.nom, defense:item.defense }; break;
  }
  flashShop = "Acheté : " + item.nom + " !"; flashTimer = 90;
  spawnParts(W/2, 160, "#d8b45a", 14, 2.4, 30, 0.05);
}

function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function playerBox(nx,ny){
  return { x:(nx===undefined?player.x:nx)-player.w/2, y:(ny===undefined?player.y:ny)-player.h/2, w:player.w, h:player.h };
}
function collides(nx,ny){
  const box = playerBox(nx,ny);
  for (const wl of walls) if (rectsOverlap(box,wl)) return true;
  return false;
}
function nearDoor(){
  const box = playerBox();
  const zone = { x:box.x-10, y:box.y-10, w:box.w+20, h:box.h+20 };
  for (const b of buildings) if (rectsOverlap(zone, b.porte)) return b;
  return null;
}

/* ----------------------- SOL PRÉ-CALCULÉ (RÉALISTE) ----------------------- */
const groundCv = document.createElement("canvas"); groundCv.width = W; groundCv.height = H;
(function(){
  const g = groundCv.getContext("2d");
  const gr = g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,"#4d7440"); gr.addColorStop(0.5,"#3f6434"); gr.addColorStop(1,"#33532a");
  g.fillStyle = gr; g.fillRect(0,0,W,H);
  // marbrures d'herbe
  for (let i=0;i<1500;i++){
    const x = Math.random()*W, y = Math.random()*H, r = 3+Math.random()*14;
    g.fillStyle = ["rgba(22,44,18,0.09)","rgba(96,140,66,0.07)","rgba(255,244,190,0.025)"][i%3];
    g.beginPath(); g.ellipse(x,y,r,r*0.5,0,0,6.3); g.fill();
  }
  // brins d'herbe
  g.strokeStyle = "rgba(20,40,16,0.25)"; g.lineWidth = 1;
  for (let i=0;i<650;i++){
    const x = Math.random()*W, y = Math.random()*H;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()*2-1), y-3-Math.random()*3); g.stroke();
  }
  // sentiers en terre battue
  function sentier(x1,y1,x2,y2,cx,cy){
    for (const cfg of [["#5f5036",30],["#6f5e40",21],["#7d6b4a",13]]){
      g.strokeStyle = cfg[0]; g.lineWidth = cfg[1]; g.lineCap = "round";
      g.beginPath(); g.moveTo(x1,y1); g.quadraticCurveTo(cx,cy,x2,y2); g.stroke();
    }
    for (let i=0;i<14;i++){
      const t = Math.random(), it = 1-t;
      const px2 = it*it*x1 + 2*it*t*cx + t*t*x2 + (Math.random()*14-7);
      const py2 = it*it*y1 + 2*it*t*cy + t*t*y2 + (Math.random()*14-7);

function enseigne(cx, y, texte){
  ctx.font = "bold 11px Georgia, serif";
  const w2 = ctx.measureText(texte).width + 22;
  ctx.strokeStyle = "#3a2c1a"; ctx.lineWidth = 1.5;

/* ------------------------------- BÂTIMENTS -------------------------------- */
function briques(x,y,w,h,alpha){
  ctx.strokeStyle = "rgba(0,0,0," + alpha + ")"; ctx.lineWidth = 1;
  for (let yy=y+11; yy<y+h; yy+=12){
    ctx.beginPath(); ctx.moveTo(x+2,yy); ctx.lineTo(x+w-2,yy); ctx.stroke();
  }
  let row = 0;
  for (let yy=y; yy<y+h-6; yy+=12){
    for (let xx=x+((row%2)?11:22); xx<x+w-4; xx+=22){
      ctx.beginPath(); ctx.moveTo(xx,yy+1); ctx.lineTo(xx,yy+11); ctx.stroke();
    }
    row++;
  }
}
function fenetre(x,y,w,h,glow,flicker){
  const f = flicker ? (0.75+0.25*Math.sin(time/150+x)) : 1;
  ctx.save();
  const g2 = ctx.createRadialGradient(x+w/2,y+h/2,1,x+w/2,y+h/2,w*1.6);
  g2.addColorStop(0,"rgba(255,190,90," + 0.22*f + ")"); g2.addColorStop(1,"rgba(255,190,90,0)");
  ctx.fillStyle = g2; ctx.fillRect(x-w,y-h,w*3,h*3);
  ctx.restore();
  rrFill(x-2,y-2,w+4,h+4,2,"#241a10");
  rrFill(x,y,w,h,1, linGrad(x,y,x,y+h,[[0,glow?shade("#ffcc66",f):"#182030"],[1,glow?shade("#c87e2a",f):"#0e1420"]]));
  ctx.strokeStyle = "#241a10"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x+w/2,y); ctx.lineTo(x+w/2,y+h); ctx.moveTo(x,y+h/2); ctx.lineTo(x+w,y+h/2); ctx.stroke();
}
function porteBois(d, arche){
  rrFill(d.x-3, d.y-4, d.w+6, d.h+4, arche?[d.w/2+3,d.w/2+3,0,0]:2, "#16100a");
  rrFill(d.x, d.y-1, d.w, d.h+1, arche?[d.w/2,d.w/2,0,0]:1,
    linGrad(d.x,d.y,d.x,d.y+d.h,[[0,"#5d4426"],[1,"#3a2a16"]]));
  ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 1;
  for (let i=1;i<4;i++){
    ctx.beginPath(); ctx.moveTo(d.x+i*d.w/4, d.y+2); ctx.lineTo(d.x+i*d.w/4, d.y+d.h-1); ctx.stroke();
  }
  ctx.fillStyle = "#8a8f99";
  ctx.fillRect(d.x+2, d.y+5, d.w-4, 2); ctx.fillRect(d.x+2, d.y+d.h-8, d.w-4, 2);
  ctx.fillStyle = "#d8b45a"; ctx.beginPath(); ctx.arc(d.x+d.w-6, d.y+d.h/2+2, 1.8, 0, 6.3); ctx.fill();
}

  ctx.fillStyle = "#22242c"; ctx.fillRect(-2.4,-19.6,1.5,1.5); ctx.fillRect(1,-19.6,1.5,1.5);
  if (type==="apoth"){

    ctx.fillStyle = "#7ae8c8"; ctx.beginPath(); ctx.arc(7.5,-9,3,0,6.3); ctx.fill();

/* ============================ HÉROS (PAR CLASSE) ========================== */
const PALETTES = {
  guerrier:{ c1:"#9a4438", c2:"#6e2f26", trim:"#d8b45a", metal:"#b9c2cf", metalD:"#8a93a3" },
  ombre:   { c1:"#333a5e", c2:"#20253e", trim:"#8f7ae8", metal:"#d5dbe6", metalD:"#9aa2b2" },
  mage:    { c1:"#63407f", c2:"#472c5e", trim:"#e8c05a", metal:"#cfd8ea", metalD:"#98a2b8" },
};
function drawHero(x,y,dir,moving,t,s,clsId,evoCol){
  const P = PALETTES[clsId] || PALETTES.guerrier;
  const accent = evoCol || P.trim;
  const skin = "#e2b68e";
  ctx.save(); ctx.translate(x,y);
  const sg = ctx.createRadialGradient(0,1,1,0,1,11*s/2.2);
  sg.addColorStop(0,"rgba(0,0,0,0.4)"); sg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(0,1,10*s/2.2,4*s/2.2,0,0,6.3); ctx.fill();
  ctx.scale(s/2.2, s/2.2);
  if (dir==="left") ctx.scale(-1,1);
  const face = (dir==="left") ? "right" : dir;
  const wk = moving ? Math.sin(t*0.02) : 0;
  const bob = moving ? -Math.abs(Math.sin(t*0.02))*1.4 : Math.sin(t*0.004)*0.5;
  ctx.translate(0,bob);
  // écharpe flottante (derrière) pour la lame des ombres
  if (clsId==="ombre"){
    const wv = Math.sin(t*0.01)*2;
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.moveTo(-3,-23); ctx.lineTo(-11-wv,-19); ctx.lineTo(-12-wv,-15);
    ctx.lineTo(-4,-19); ctx.closePath(); ctx.fill();
  }
  // cape dans le dos (vue de dos)
  if (face==="up"){
    ctx.fillStyle = shade(P.c2,0.8);
    ctx.beginPath(); ctx.moveTo(-6,-23); ctx.lineTo(-7,-9+wk); ctx.lineTo(7,-9-wk); ctx.lineTo(6,-23);
    ctx.closePath(); ctx.fill();
  }
  // jambes / bas de robe
  if (clsId==="mage"){
    ctx.beginPath(); ctx.moveTo(-6,-13); ctx.lineTo(-8,0); ctx.lineTo(8,0); ctx.lineTo(6,-13); ctx.closePath();
    ctx.fillStyle = linGrad(-8,-13,8,0,[[0,P.c1],[1,P.c2]]); ctx.fill();
    ctx.fillStyle = accent; ctx.globalAlpha = 0.8; ctx.fillRect(-8,-2,16,1.6); ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = "#23262e";
    ctx.fillRect(-4.6+wk*2.2,-9,4,9.2);
    ctx.fillRect(0.8-wk*2.2,-9,4,9.2);
    ctx.fillStyle = "#15171d";
    ctx.fillRect(-4.6+wk*2.2,-2.6,4,2.8);
    ctx.fillRect(0.8-wk*2.2,-2.6,4,2.8);
  }
  // torse
  rrFill(-6.5,-23,13,12,3, linGrad(-6,-23,6,-11,[[0,P.c1],[1,P.c2]]));
  ctx.fillStyle = "rgba(0,0,0,0.16)"; ctx.fillRect(1.8,-22,4.4,10.4);
  ctx.fillStyle = "#2c2115"; ctx.fillRect(-6.5,-13.4,13,2.6);
  ctx.fillStyle = accent; ctx.fillRect(-1.2,-13.6,2.6,3);
  // détails de classe
  if (clsId==="guerrier"){
    rrFill(-4.6,-22,9.2,6.6,2, linGrad(-4,-22,4,-15,[[0,P.metal],[1,P.metalD]]));
    ctx.fillStyle = P.metalD;
    ctx.beginPath(); ctx.arc(-7,-21.4,2.7,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-21.4,2.7,0,6.3); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.beginPath(); ctx.arc(-7.7,-22.1,0.9,0,6.3); ctx.fill();
  } else if (clsId==="ombre"){
    ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-6,-22); ctx.lineTo(6,-14); ctx.stroke();
    ctx.fillStyle = accent; ctx.fillRect(-5.4,-24.4,10.8,2.6);
  } else {
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.moveTo(0,-21); ctx.lineTo(2.2,-18.4); ctx.lineTo(0,-15.8); ctx.lineTo(-2.2,-18.4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(232,192,90,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-6.5,-12.4); ctx.lineTo(6.5,-12.4); ctx.stroke();
  }
  // bras
  ctx.fillStyle = P.c2;
  rrFill(-8.6,-22,3.2,8.4,1.4,P.c2);
  rrFill(5.4,-22,3.2,8.4,1.4,P.c2);
  // tête
  rrFill(-4.6,-32.6,9.2,8.4,3, skin);
  if (face==="down"){
    ctx.fillStyle = "#20222a"; ctx.fillRect(-2.6,-28.8,1.5,1.6); ctx.fillRect(1.1,-28.8,1.5,1.6);
  } else if (face==="right"){
    ctx.fillStyle = "#20222a"; ctx.fillRect(1.6,-28.8,1.6,1.6);
  }
  // couvre-chef par classe
  if (clsId==="guerrier"){
    rrFill(-5.2,-34.4,10.4,6.2,3, linGrad(-5,-34,5,-28,[[0,P.metal],[1,P.metalD]]));
    if (face!=="up") { ctx.fillStyle = P.metalD; ctx.fillRect(-0.8,-30.4,1.6,3.6); }
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.moveTo(-1,-34); ctx.quadraticCurveTo(0,-40,-4,-39); ctx.quadraticCurveTo(-1.5,-37.5,-2.4,-34);
    ctx.closePath(); ctx.fill();
  } else if (clsId==="ombre"){
    rrFill(-5.2,-34.2,10.4,7,3.4, P.c1);
    if (face==="up") rrFill(-4.6,-32.6,9.2,8.4,3, P.c1);
    else { ctx.fillStyle = P.c2; ctx.fillRect(-4.6,-27.4,9.2,3.2); }
  } else {
    ctx.fillStyle = P.c2;
    ctx.beginPath(); ctx.ellipse(0,-31.6,7.4,2.4,0,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4.6,-31.6); ctx.lineTo(1.4,-43); ctx.lineTo(4.6,-31.6); ctx.closePath();
    ctx.fillStyle = P.c1; ctx.fill();
    ctx.fillStyle = accent; ctx.fillRect(-3.6,-33.6,7.6,1.7);
    if (face==="up") rrFill(-4.6,-32.6,9.2,5,2, P.c2);
  }
  // arme
  if (clsId==="guerrier"){
    if (face==="down"){
      ctx.fillStyle = P.metalD;
      ctx.beginPath(); ctx.ellipse(-8.4,-16.4,3.4,4.2,0,0,6.3); ctx.fill();
      ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(-8.4,-16.4,1.3,0,6.3); ctx.fill();
    }
    ctx.fillStyle = linGrad(8,-30,10,-14,[[0,"#e8edf4"],[1,P.metalD]]);
    ctx.fillRect(7.8,-29,2.1,13);
    ctx.beginPath(); ctx.moveTo(7.8,-29); ctx.lineTo(8.85,-32); ctx.lineTo(9.9,-29); ctx.closePath();
    ctx.fillStyle = "#e8edf4"; ctx.fill();
    ctx.fillStyle = accent; ctx.fillRect(6.2,-16.4,5.4,1.7);
    ctx.fillStyle = "#3a2a16"; ctx.fillRect(8,-14.7,1.7,3.6);
  } else if (clsId==="ombre"){
    ctx.fillStyle = linGrad(8,-33,9.4,-16,[[0,"#eef2f8"],[1,P.metalD]]);
    ctx.fillRect(8,-32.4,1.5,16);
    ctx.fillStyle = accent; ctx.fillRect(6.9,-16.6,3.7,1.4);
    ctx.fillStyle = "#1c1e26"; ctx.fillRect(8.1,-15.2,1.3,4);
  } else {
    ctx.fillStyle = "#6b4e2f"; ctx.fillRect(7.7,-38,1.9,38);
    ctx.fillStyle = "#543d26"; ctx.fillRect(7.7,-20,1.9,1.4);
    const og = ctx.createRadialGradient(8.6,-39.6,0.6,8.6,-39.6,7);
    og.addColorStop(0, accent); og.addColorStop(0.35,"rgba(216,180,90,0.5)"); og.addColorStop(1,"rgba(216,180,90,0)");
    ctx.fillStyle = og; ctx.beginPath(); ctx.arc(8.6,-39.6,7,0,6.3); ctx.fill();
    ctx.fillStyle = "#fff2cc"; ctx.beginPath(); ctx.arc(8.6,-39.6,2,0,6.3); ctx.fill();
  }
  ctx.restore();
}

/* ================================= ENNEMIS ================================ */
const BESTIAIRE = [
  { nom:"Gobelin des ombres", type:"gobelin", pv:24,  dgt:6,  esq:8,  or:[10,20],  xp:9,  tint:"#5f8a3c", eye:"#ffd23a" },
  { nom:"Bandit masqué",      type:"bandit",  pv:36,  dgt:9,  esq:14, or:[18,32],  xp:15, tint:"#8a6a42", eye:"#ff4a3a" },
  { nom:"Spectre errant",     type:"spectre", pv:30,  dgt:9,  esq:26, or:[16,30],  xp:14, tint:"#5c7ec2", eye:"#7ae8ff", flotte:true },
  { nom:"Rōnin déchu",        type:"ronin",   pv:55,  dgt:13, esq:18, or:[35,60],  xp:28, tint:"#a84848", eye:"#ff3a3a", crit:10 },
  { nom:"Ogre de guerre",     type:"ogre",    pv:90,  dgt:17, esq:5,  or:[50,85],  xp:42, tint:"#6f7f43", eye:"#ffb03a", taille:1.35 },
  { nom:"Shōgun spectral",    type:"shogun",  pv:120, dgt:22, esq:22, or:[85,140], xp:70, tint:"#7c4fd0", eye:"#c9a3ff", crit:15, taille:1.15 },
];
function creerEnnemi(){
  const n = Math.min(BESTIAIRE.length, 1 + Math.ceil(player.niveau/1.6));
  const t = BESTIAIRE[Math.floor(Math.random()*n)];
  const boost = 1 + (player.niveau-1)*0.13;
  return {
    nom:t.nom, type:t.type, tint:t.tint, eye:t.eye, flotte:!!t.flotte,
    taille:t.taille||1, crit:t.crit||0, esquive:t.esq,
    pvMax:Math.round(t.pv*boost), pv:Math.round(t.pv*boost),
    degats:Math.round(t.dgt*boost),
    or:Math.round(t.or[0]+Math.random()*(t.or[1]-t.or[0])),
    xp:Math.round(t.xp*boost),
    hitFlash:0,
  };
}
function drawEnemy(x,y,e,mirror){
  const s = 2.9*e.taille;
  const bob = e.flotte ? Math.sin(time/320)*6 : 0;
  const br = 1 + Math.sin(time/280)*0.022;
  const fl = e.hitFlash > 0;
  function col(c){ return fl ? "#ffffff" : c; }
  ctx.save(); ctx.translate(x, y-bob);
  ctx.fillStyle = e.flotte ? "rgba(0,0,0,0.2)" : "rgba(0,0,0,0.38)";
  ctx.beginPath(); ctx.ellipse(0,2,15*e.taille,5*e.taille,0,0,6.3); ctx.fill();
  ctx.scale(mirror?-s:s, s*br);
  if (e.flotte) ctx.globalAlpha = 0.85;
  const D = shade(e.tint, 0.55);
  // jambes ou traîne spectrale
  if (e.flotte){
    ctx.fillStyle = col(D);
    ctx.beginPath(); ctx.moveTo(-8,-10); ctx.lineTo(-5,-1); ctx.lineTo(-2,-8); ctx.lineTo(1,0);
    ctx.lineTo(4,-8); ctx.lineTo(7,-2); ctx.lineTo(8,-10); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = col("#20242c");
    ctx.fillRect(-6.5,-9,5,9); ctx.fillRect(1.5,-9,5,9);
    ctx.fillStyle = col("#15181e");
    ctx.fillRect(-6.5,-2.4,5,2.6); ctx.fillRect(1.5,-2.4,5,2.6);
  }
  // corps
  rrFill(-9,-26,18,17,5, fl ? "#ffffff" : linGrad(-9,-26,9,-9,[[0,e.tint],[1,D]]));
  ctx.fillStyle = col("#1b1e26"); ctx.fillRect(-9,-15,18,3.2);
  ctx.fillStyle = col(D);
  rrFill(-12.6,-24,4,10,2, col(D)); rrFill(8.6,-24,4,10,2, col(D));
  // tête
  rrFill(-6,-36,12,10,4, col("#262a33"));
  ctx.save();
  ctx.shadowColor = e.eye; ctx.shadowBlur = 7;
  ctx.fillStyle = e.eye;
  ctx.fillRect(-3.6,-32.6,2.4,2.4); ctx.fillRect(1.4,-32.6,2.4,2.4);
  ctx.restore();
  // attributs par type
  if (e.type==="gobelin"){
    ctx.fillStyle = col(e.tint);
    ctx.beginPath(); ctx.moveTo(-6,-33); ctx.lineTo(-11,-36); ctx.lineTo(-6,-30); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6,-33); ctx.lineTo(11,-36); ctx.lineTo(6,-30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e8e8ec"; ctx.fillRect(-2.4,-27.6,1.4,1.6); ctx.fillRect(1,-27.6,1.4,1.6);
  } else if (e.type==="bandit"){
    ctx.fillStyle = col("#8f2334"); ctx.fillRect(-6,-37.4,12,2.8);
    ctx.fillStyle = col("#10131a"); ctx.fillRect(-6,-29.4,12,3.4);
  } else if (e.type==="ronin" || e.type==="shogun"){
    ctx.fillStyle = col(e.type==="shogun" ? "#2c2436" : "#5a4a2e");
    ctx.beginPath(); ctx.moveTo(-9.5,-35); ctx.lineTo(0,-42); ctx.lineTo(9.5,-35); ctx.closePath(); ctx.fill();
    if (e.type==="shogun"){
      ctx.strokeStyle = col("#d8b45a"); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-4,-40); ctx.quadraticCurveTo(-9,-46,-7,-50); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4,-40); ctx.quadraticCurveTo(9,-46,7,-50); ctx.stroke();
    }
  } else if (e.type==="ogre"){
    ctx.fillStyle = "#e8e0d0";
    ctx.beginPath(); ctx.moveTo(-4,-27); ctx.lineTo(-5.5,-23.6); ctx.lineTo(-2.6,-26.6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4,-27); ctx.lineTo(5.5,-23.6); ctx.lineTo(2.6,-26.6); ctx.closePath(); ctx.fill();
  }
  // arme
  if (e.type==="ogre" || e.type==="gobelin"){
    ctx.save(); ctx.translate(12,-18); ctx.rotate(0.5);
    rrFill(-1.6,-14,3.2,16,1.6, col("#5a4128"));
    rrFill(-2.8,-16,5.6,6,2.4, col("#4a3520"));
    ctx.fillStyle = col("#8a8f99");
    ctx.fillRect(-2.2,-15,1.4,1.4); ctx.fillRect(1,-12.6,1.4,1.4);
    ctx.restore();
  } else if (e.type!=="spectre"){
    ctx.fillStyle = fl ? "#fff" : linGrad(11,-34,13,-12,[[0,"#eef2f8"],[1,"#8a93a3"]]);
    ctx.fillRect(11,-33,1.9,20);
    ctx.fillStyle = col("#d8b45a"); ctx.fillRect(9.6,-14,4.7,1.6);
  }
  ctx.restore();
  if (e.hitFlash > 0) e.hitFlash--;
}

/* ============================ LOGIQUE : COMBAT ============================ */
const HX = 205, HY = 432, EX = 560, EY = 372;
function entrerDonjon(){
  combat = {
    ennemi: creerEnnemi(), tour:"joueur", cursor:0, anim:0, fini:false,
    buff:null, voile:0, critNext:false, poison:null,
    playerFlash:0, heroLunge:0, enemyLunge:0, flash:null, intro:60,
  };
  player.energie = energieMax();
  combatLog.length = 0;
  log("Un " + combat.ennemi.nom + " surgit des ténèbres !");
  state = S.COMBAT;
}
function frapper(mult, opts){
  opts = opts || {};
  const e = combat.ennemi;
  if (!opts.imparable && Math.random()*100 < e.esquive){
    log("Le " + e.nom + " esquive !");
    addFloat(EX, EY-120, "Esquive", "#9aa0ac", 14);
    return 0;
  }
  let d = Math.round(degatsAttaque()*mult*(0.9+Math.random()*0.25));
  if (combat.critNext){ d = Math.round(d*2.5); combat.critNext = false; addFloat(EX, EY-146, "CRITIQUE !", "#ffd34a", 17); }
  e.pv = Math.max(0, e.pv-d); e.hitFlash = 9;
  combat.heroLunge = 12;
  spawnParts(EX, EY-56, "#ff6a4a", 14, 3, 26, 0.12);
  spawnParts(EX, EY-56, "#ffe9a0", 6, 2.2, 20, 0.1);
  addFloat(EX, EY-120, "-"+d, "#ffffff", 16);
  log((opts.label ? opts.label + " : " : "Vous infligez ") + d + " dégâts" + (opts.label?" !":"."));
  return d;
}
function degatsMagiques(base, label, col){
  const e = combat.ennemi;
  const d = Math.round(base*(0.9+Math.random()*0.25));
  e.pv = Math.max(0, e.pv-d); e.hitFlash = 11;
  combat.flash = { col:col, t:13 };
  spawnParts(EX, EY-60, col, 26, 3.4, 32, 0.05);
  addFloat(EX, EY-124, "-"+d, col, 17);
  log(label + " : " + d + " dégâts !");
  return d;
}
function soigner(n){
  n = Math.round(n);
  player.pv = Math.min(player.pvMax, player.pv+n);
  spawnParts(HX, HY-60, "#6ae87a", 16, 2, 30, -0.04);
  addFloat(HX, HY-110, "+"+n, "#6ae87a", 15);
  log("Vous récupérez " + n + " PV.");
}
function attaqueBase(){
  frapper(1, {});
  if (combat.ennemi.pv > 0 && Math.random()*100 < doubleChance()){
    addFloat(EX, EY-146, "Double frappe !", "#8ae8b0", 13);
    frapper(0.6, { label:"Double frappe" });
  }
  apresAction();
}
function utiliserCapacite(){
  const cap = capaciteActuelle();
  if (player.energie < cap.cout){ log("Énergie insuffisante pour " + cap.nom + " !"); return; }
  player.energie -= cap.cout;
  switch(cap.id){
    case "titan": frapper(2.2, { imparable:true, label:cap.nom }); break;
    case "danse": for (let i=0;i<3;i++) if (combat.ennemi.pv>0) frapper(0.8, { label:cap.nom }); break;
    case "feu": degatsMagiques(12 + player.esprit*3.5, cap.nom, "#ff8a3a"); break;
    case "rage": {
      const auto = Math.max(1, Math.round(player.pvMax*0.08));
      player.pv = Math.max(1, player.pv-auto);
      addFloat(HX, HY-110, "-"+auto, "#ff7a6a", 13);
      frapper(3.2, { imparable:true, label:cap.nom });
    } break;
    case "jugement": frapper(1.8, { imparable:true, label:cap.nom }); soigner(player.pvMax*0.25); break;
    case "etendard":
      combat.buff = { force:5, armure:6, esquive:10, tours:4 };
      combat.flash = { col:"#e8c05a", t:12 };
      log("Étendard levé ! Force et défense accrues (4 tours).");
      break;
    case "voile":
      combat.voile = 2; combat.critNext = true;
      combat.flash = { col:"#8f7ae8", t:12 };
      spawnParts(HX, HY-50, "#8f7ae8", 22, 2.6, 32, -0.02);
      log("Vous vous fondez dans les ombres...");
      break;
    case "estocade": for (let i=0;i<4;i++) if (combat.ennemi.pv>0) frapper(0.7, { label:cap.nom }); break;
    case "venin":
      frapper(1.3, { label:cap.nom });
      if (combat.ennemi.pv > 0){
        combat.poison = { dgt:4+player.esprit*2, tours:3 };
        log("Le poison s'insinue dans ses veines !");
      }
      break;
    case "meteore": shake = 14; degatsMagiques(20 + player.esprit*4.5, cap.nom, "#ff5a2a"); break;
    case "drain": soigner(degatsMagiques(10 + player.esprit*2.8, cap.nom, "#5ae89a")); break;
    case "benediction":
      soigner(12 + player.esprit*3);
      combat.buff = { force:0, armure:6, esquive:0, tours:3 };
      combat.flash = { col:"#5ab8e8", t:12 };
      log("Une aura sacrée vous protège (3 tours).");
      break;
  }
  apresAction();
}
function boirePotion(){
  if (player.potions <= 0){ log("Vous n'avez plus de potion !"); return; }
  player.potions--; soigner(30);
  apresAction();
}
function tenterFuite(){
  const chance = 30 + player.vitesse*4;
  if (Math.random()*100 < chance){
    log("Vous fuyez le combat...");
    combat.fini = true;
    setTimeout(function(){ combat = null; state = S.MAP; }, 650);
  } else {
    log("Fuite ratée !");
    finTourJoueur();
  }
}
function apresAction(){
  if (combat.ennemi.pv <= 0){ victoire(); return; }
  finTourJoueur();
}
function finTourJoueur(){ combat.tour = "ennemi"; combat.anim = 46; }
function tourEnnemi(){
  const e = combat.ennemi;
  combat.enemyLunge = 12;
  if (combat.voile > 0){
    combat.voile--;
    log("Vous êtes insaisissable !");
    addFloat(HX, HY-110, "Esquive !", "#8f7ae8", 14);
  } else if (Math.random()*100 < esquivePct()){
    log("Vous esquivez son attaque !");
    addFloat(HX, HY-110, "Esquive !", "#7ae8b0", 14);
  } else {
    let d = e.degats + Math.floor(Math.random()*4) - armureTotale();
    d = Math.max(1, d);
    if (e.crit && Math.random()*100 < e.crit){ d = Math.round(d*1.8); log("Coup critique ennemi !"); }
    player.pv = Math.max(0, player.pv-d);
    combat.playerFlash = 10; shake = 9;
    spawnParts(HX, HY-56, "#ff4a4a", 13, 2.8, 26, 0.12);
    addFloat(HX, HY-112, "-"+d, "#ff7a6a", 16);
    log("Le " + e.nom + " vous inflige " + d + " dégâts.");
  }
  if (player.pv <= 0){ defaite(); return; }
  if (combat.buff){
    combat.buff.tours--;
    if (combat.buff.tours <= 0){ combat.buff = null; log("Votre aura se dissipe."); }
  }
  debutTourJoueur();
}
function debutTourJoueur(){
  combat.tour = "joueur";
  player.energie = Math.min(energieMax(), player.energie + 6 + player.esprit);
  if (combat.poison && combat.poison.tours > 0){
    const e = combat.ennemi, d = combat.poison.dgt;
    e.pv = Math.max(0, e.pv-d); combat.poison.tours--;
    e.hitFlash = 6;
    spawnParts(EX, EY-56, "#5ad86a", 10, 1.8, 26, 0);
    addFloat(EX, EY-120, "-"+d+" ☠", "#7ae86a", 14);
    log("Le poison ronge l'ennemi (" + d + ").");
    if (e.pv <= 0){ victoire(); return; }
  }
}
function levelUp(){
  player.xp -= player.xpMax; player.niveau++;
  player.xpMax = Math.round(player.xpMax*1.5);
  let dpv = 6, df = 1, dv = 1, de = 1;
  const cid = player.classe.id;
  if (cid==="guerrier"){ df++; dpv += 4; }
  else if (cid==="ombre"){ dv++; }
  else { de++; }
  player.pvMax += dpv; player.force += df; player.vitesse += dv; player.esprit += de;
  player.pv = player.pvMax; player.energie = energieMax();
  return "PV+" + dpv + " · FOR+" + df + " · VIT+" + dv + " · ESP+" + de;
}
function victoire(){
  combat.fini = true;
  const e = combat.ennemi;
  spawnParts(EX, EY-56, e.tint, 34, 3.6, 42, 0.08);
  spawnParts(EX, EY-56, "#ffe9a0", 16, 2.6, 34, 0.05);
  player.or += e.or; player.xp += e.xp;
  const soin = player.esprit;
  player.pv = Math.min(player.pvMax, player.pv + soin);
  const msgs = ["Victoire !", "Le " + e.nom + " est vaincu.",
    "Butin : " + e.or + " or · " + e.xp + " XP · +" + soin + " PV (Esprit)"];
  while (player.xp >= player.xpMax){
    msgs.push("★ NIVEAU " + (player.niveau+1) + " — " + levelUp());
  }
  const evolue = player.niveau >= 5 && !player.evolution;
  if (evolue) msgs.push("Votre âme s'éveille... Choisissez votre voie !");
  setTimeout(function(){
    showMessage(msgs, function(){
      combat = null;
      if (evolue){ evoCursor = 0; state = S.EVOLVE; }
      else state = S.MAP;
    }, "combat");
  }, 550);
}
function defaite(){
  combat.fini = true;
  setTimeout(function(){ combat = null; state = S.GAMEOVER; }, 500);
}
function appliquerEvolution(evo){
  player.evolution = evo;
  player.pvMax += evo.bonus.pv; player.force += evo.bonus.force;
  player.vitesse += evo.bonus.vitesse; player.esprit += evo.bonus.esprit;
  player.pv = player.pvMax; player.energie = energieMax();
  showMessage(["Vous devenez " + evo.nom + " !",
    "Nouvelle capacité : " + evo.capacite.nom,
    evo.capacite.desc], function(){ state = S.MAP; }, "map");
}

/* ============================ MISES À JOUR (INPUT) ======================== */
function updateMap(dt){
  let dx = 0, dy = 0;
  if (held("arrowleft","q","a")){ dx -= 1; player.dir = "left"; }
  if (held("arrowright","d")){ dx += 1; player.dir = "right"; }
  if (held("arrowup","z","w")){ dy -= 1; player.dir = "up"; }
  if (held("arrowdown","s")){ dy += 1; player.dir = "down"; }
  player.moving = (dx!==0 || dy!==0);
  if (player.moving){
    const len = Math.hypot(dx,dy) || 1, spd = 2.3;
    const mx = dx/len*spd, my = dy/len*spd;
    if (!collides(player.x+mx, player.y)) player.x += mx;
    if (!collides(player.x, player.y+my)) player.y += my;
    player.animTime += dt;
  } else player.animTime = 0;
  const b = nearDoor();
  if (b && pressed("e","enter"," ")){
    if (b.id==="donjon") entrerDonjon();
    else if (b.id==="apothicaire"){ shop = { data:potionShop, cursor:0 }; state = S.SHOP; }
    else { shop = { data:smithShop, cursor:0 }; state = S.SHOP; }
  }
}
function updateCombat(){
  if (combat.playerFlash > 0) combat.playerFlash--;
  if (combat.heroLunge > 0) combat.heroLunge--;
  if (combat.enemyLunge > 0) combat.enemyLunge--;
  if (combat.intro > 0) combat.intro--;
  if (combat.flash && --combat.flash.t <= 0) combat.flash = null;
  if (combat.fini) return;
  if (combat.tour === "ennemi"){
    if (combat.anim > 0) combat.anim--;
    else tourEnnemi();
    return;
  }
  const nOpts = 4;
  if (pressed("arrowup","z","w")) combat.cursor = (combat.cursor+nOpts-1)%nOpts;
  if (pressed("arrowdown","s")) combat.cursor = (combat.cursor+1)%nOpts;
  if (pressed("1")) combat.cursor = 0;
  if (pressed("2")) combat.cursor = 1;
  if (pressed("3")) combat.cursor = 2;
  if (pressed("4")) combat.cursor = 3;
  if (pressed("e","enter"," ","1","2","3","4")){
    if (combat.cursor===0) attaqueBase();
    else if (combat.cursor===1) utiliserCapacite();
    else if (combat.cursor===2) boirePotion();
    else tenterFuite();
  }
}
function updateShop(){
  const items = shop.data.items;
  if (pressed("arrowup","z","w")) shop.cursor = (shop.cursor+items.length-1)%items.length;
  if (pressed("arrowdown","s")) shop.cursor = (shop.cursor+1)%items.length;
  for (let i=1;i<=items.length;i++){
    if (pressed(String(i))){ shop.cursor = i-1; acheter(items[i-1]); return; }
  }
  if (pressed("e","enter"," ")) acheter(items[shop.cursor]);
  if (pressed("escape","x")) state = S.MAP;
}
function updateSelect(){
  if (pressed("arrowleft","q")) selCursor = (selCursor+2)%3;
  if (pressed("arrowright","d")) selCursor = (selCursor+1)%3;
  if (pressed("e","enter"," ")){
    newGame(CLASSES[selCursor]);
    showMessage(["Bienvenue, " + player.classe.nom + ".",
      "Le donjon au nord regorge d'or et de gloire.",
      "L'apothicaire et le forgeron vous équiperont."], function(){ state = S.MAP; }, "map");
  }
}
function updateEvolve(){
  const evos = EVOLUTIONS[player.classe.id];
  if (pressed("arrowleft","q")) evoCursor = (evoCursor+2)%3;
  if (pressed("arrowright","d")) evoCursor = (evoCursor+1)%3;
  if (pressed("e","enter"," ")) appliquerEvolution(evos[evoCursor]);
}

  txt(titre, W/2, 52, 30, "#e8c05a", "center", "bold 30px Georgia");
  ctx.restore();
  txt(sousTitre, W/2, 78, 13, "#8a93a6", "center", "italic 13px Georgia");
  for (let i=0;i<cards.length;i++){
    const c = cards[i], sel = i===cursor;
    const cx = 34 + i*250, cy = sel ? 96 : 104, cw = 232, ch = 424;
    if (sel){
      ctx.save(); ctx.shadowColor = c.couleur; ctx.shadowBlur = 30;
      rrFill(cx, cy, cw, ch, 12, "rgba(20,23,34,0.98)");
      ctx.restore();
      rrStroke(cx+1.5, cy+1.5, cw-3, ch-3, 11, c.couleur, 2.2);
    } else {
      rrFill(cx, cy, cw, ch, 12, "rgba(15,17,25,0.94)");
      rrStroke(cx+1.5, cy+1.5, cw-3, ch-3, 11, "rgba(120,128,148,0.4)", 1.2);
    }
    txt(c.nom, cx+cw/2, cy+30, 17, sel ? c.couleur : "#c8cad2", "center", "bold 17px Georgia");
    txt(c.titre, cx+cw/2, cy+48, 11, "#8a93a6", "center", "italic 11px Georgia");
    // portrait
    const pg = ctx.createRadialGradient(cx+cw/2, cy+118, 4, cx+cw/2, cy+118, 52);
    pg.addColorStop(0, "rgba(255,255,255,0.06)"); pg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = pg; ctx.fillRect(cx+20, cy+58, cw-40, 110);
    drawHero(cx+cw/2, cy+158, "down", true, time, 3.1, c.clsId, c.evoCol);
    // stats
    let sy = cy+192;
    for (const st of c.statLines){
      txt(st[0], cx+18, sy, 11, st[2]||"#c8cad2", "left", "bold 11px Georgia");
      if (st[1] !== null) barre(cx+92, sy-9, 118, 8, st[1], st[2]||"#c8cad2", shade(st[2]||"#888888",0.5));
      else txt(st[3], cx+92, sy, 11, "#e8d29a");
      sy += 20;
    }
    // capacité
    rrFill(cx+14, sy-4, cw-28, 74, 6, "rgba(216,180,90,0.07)");
    rrStroke(cx+14, sy-4, cw-28, 74, 6, "rgba(216,180,90,0.3)", 1);
    txt("✦ " + c.capacite.nom + "  (" + c.capacite.cout + " én.)", cx+24, sy+14, 11.5, "#e8c05a", "left", "bold 11.5px Georgia");
    wrapTxt(c.capacite.desc, cx+24, sy+31, cw-48, 14, 10.5, "#b8bcc8");
    wrapTxt(c.desc, cx+cw/2, sy+92, cw-36, 14, 10.5, "#8a93a6", "center");
  }
  txt(footer, W/2, H-38, 12, "#c8cad2", "center");
  txt("FORCE → armure & dégâts   ·   VITESSE → esquive, double frappe & fuite   ·   ESPRIT → magie & énergie",
    W/2, H-16, 11, "#7a8394", "center");
  ctx.drawImage(vinCv, 0, 0);
}
function drawSelectScene(){
  const cards = CLASSES.map(function(c){
    return { nom:c.nom, titre:c.titre, couleur:c.couleur, clsId:c.id, evoCol:null,
      capacite:c.capacite, desc:c.desc,
      statLines:[
        ["PV " + c.stats.pv, c.stats.pv/70, "#e05a6a"],
        ["FOR " + c.stats.force, c.stats.force/12, "#e88a8a"],
        ["VIT " + c.stats.vitesse, c.stats.vitesse/12, "#8ae8b0"],
        ["ESP " + c.stats.esprit, c.stats.esprit/12, "#a08ae8"],
      ] };
  });
  drawCardScreen("SHADOW OF THE WARRIOR", "Choisissez votre voie, guerrier de l'ombre",
    cards, selCursor, "← → choisir   ·   E commencer l'aventure");
}
function drawEvolveScene(){
  const evos = EVOLUTIONS[player.classe.id];
  const cards = evos.map(function(ev){
    return { nom:ev.nom, titre:"Évolution de " + player.classe.nom, couleur:ev.couleur,
      clsId:player.classe.id, evoCol:ev.couleur, capacite:ev.capacite, desc:ev.desc,
      statLines:[
        ["PV", null, "#e05a6a", "+" + ev.bonus.pv],
        ["FOR", null, "#e88a8a", "+" + ev.bonus.force],
        ["VIT", null, "#8ae8b0", "+" + ev.bonus.vitesse],
        ["ESP", null, "#a08ae8", "+" + ev.bonus.esprit],
      ] };
  });
  drawCardScreen("L'ÉVEIL", "Niveau 5 atteint — votre âme réclame une nouvelle forme",
    cards, evoCursor, "← → choisir   ·   E embrasser votre destinée");
}

/* ========================= RENDU : MESSAGE / GAMEOVER ===================== */
function drawMsgScene(){
  if (msg.fond === "combat" && combat) drawCombatScene(); else drawMapScene();
  ctx.fillStyle = "rgba(4,6,10,0.62)"; ctx.fillRect(0,0,W,H);
  const bw = 500, bh = 58 + msg.lignes.length*24;
  const bx = (W-bw)/2, by = (H-bh)/2;
  panel(bx, by, bw, bh);
  for (let i=0;i<msg.lignes.length;i++){
    const l = msg.lignes[i];
    const star = l.indexOf("★")===0;
    txt(l, W/2, by+32+i*24, i===0?16:13, i===0 ? "#e8c05a" : star ? "#ffd34a" : "#d0d3da",
      "center", (i===0||star ? "bold " : "") + (i===0?16:13) + "px Georgia");
  }
  txt("E / Entrée pour continuer", W/2, by+bh-13, 10, "#7a8394", "center", "italic 10px Georgia");
}
function drawGameOverScene(){
  ctx.fillStyle = linGrad(0,0,0,H,[[0,"#1a0a0e"],[1,"#060305"]]); ctx.fillRect(0,0,W,H);
  if (Math.random()<0.25) parts.push({x:Math.random()*W, y:-6, vx:0, vy:0.5+Math.random(),
    life:130, max:130, color:"rgba(180,40,60,0.4)", size:2, grav:0.002});
  drawParts();
  ctx.save(); ctx.shadowColor = "#b8324a"; ctx.shadowBlur = 34;
  txt("VOUS ÊTES TOMBÉ", W/2, H/2-46, 40, "#b8324a", "center", "bold 40px Georgia");
  ctx.restore();
  txt(nomClasse() + " · niveau " + player.niveau + " — l'ombre se souviendra de vous.",
    W/2, H/2-6, 14, "#c8cad2", "center");
  txt("La moitié de votre or se perd dans les ténèbres...", W/2, H/2+20, 12, "#8a93a6", "center", "italic 12px Georgia");
  txt("E / Entrée pour renaître", W/2, H/2+64, 15, "#e8c05a", "center", "bold 15px Georgia");
  ctx.drawImage(vinCv, 0, 0);
}
function renaitre(){
  player.pv = player.pvMax;
  player.energie = energieMax();
  player.or = Math.floor(player.or/2);
  player.x = 400; player.y = 440; player.dir = "down";
  state = S.MAP;
}

/* ============================= BOUCLE PRINCIPALE ========================== */
let last = performance.now();
function loop(now){
  const dt = Math.min(50, now-last); last = now; time = now;
  ctx.save();
  if (shake > 0){ shake--; ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }
  switch(state){
    case S.SELECT: updateSelect(); if (state===S.SELECT) drawSelectScene(); else drawMsgScene(); break;
    case S.MAP: updateMap(dt); drawMapScene(); break;
    case S.COMBAT: updateCombat(); if (combat) drawCombatScene(); else drawMapScene(); break;
    case S.SHOP: updateShop(); if (state===S.SHOP) drawShopScene(); else drawMapScene(); break;
    case S.EVOLVE: updateEvolve(); if (state===S.EVOLVE) drawEvolveScene(); else drawMsgScene(); break;
    case S.MSG:
      drawMsgScene();
      if (pressed("e","enter"," ")){ const su = msg.suite; msg.suite = null; if (su) su(); }
      break;
    case S.GAMEOVER:
      drawGameOverScene();
      if (pressed("e","enter"," ")) renaitre();
      break;
  }
  ctx.restore();
  clearJustPressed();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
