<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shinobi no Yuukan — jeu de ninja par navigateur</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Écran titre / création de personnage -->
    <section id="title-screen" class="screen">
      <div class="title-box">
        <h1>忍 &nbsp;Shinobi no Yuukan</h1>
        <p class="subtitle">Deviens le plus grand shinobi du pays de Yuukan.</p>

        <div id="new-game-panel">
          <label class="field">
            <span>Nom du ninja</span>
            <input id="hero-name" type="text" maxlength="14" placeholder="ex. Kaito" />
          </label>

          <p class="field-label">Choisis ton village caché</p>
          <div id="village-choice" class="village-choice"></div>

          <div class="title-actions">
            <button id="btn-start" class="btn btn-primary">Commencer l'aventure</button>
            <button id="btn-continue" class="btn">Continuer</button>
          </div>
          <p id="title-hint" class="hint"></p>
        </div>
      </div>
    </section>

    <!-- Écran de jeu (carte) -->
    <section id="game-screen" class="screen hidden">
      <div class="game-layout">
        <div class="viewport-wrap">
          <canvas id="view" width="832" height="544"></canvas>
          <div id="toast" class="toast hidden"></div>
        </div>

        <aside id="sidebar">
          <div class="hud-name">
            <span id="hud-hero">—</span>
            <span id="hud-village" class="hud-village">—</span>
          </div>
          <div class="hud-level">Niveau <b id="hud-level">1</b> · <span id="hud-rank">Genin</span></div>

          <div class="bar"><span class="bar-label">PV</span>
            <div class="bar-track"><div id="bar-hp" class="bar-fill hp"></div><span id="txt-hp" class="bar-text"></span></div>
          </div>
          <div class="bar"><span class="bar-label">Chakra</span>
            <div class="bar-track"><div id="bar-ck" class="bar-fill ck"></div><span id="txt-ck" class="bar-text"></span></div>
          </div>
          <div class="bar"><span class="bar-label">Exp</span>
            <div class="bar-track"><div id="bar-xp" class="bar-fill xp"></div><span id="txt-xp" class="bar-text"></span></div>
          </div>

          <ul class="stats">
            <li>Taijutsu <b id="st-tai">0</b></li>
            <li>Ninjutsu <b id="st-nin">0</b></li>
            <li>Genjutsu <b id="st-gen">0</b></li>
            <li>Vitesse <b id="st-spd">0</b></li>
            <li>Ryō <b id="st-ryo">0</b> ₽</li>
            <li>Points <b id="st-pts">0</b></li>
          </ul>

          <div id="loc-info" class="loc-info">—</div>

          <div class="side-actions">
            <button id="btn-menu" class="btn btn-small">Menu du village (E)</button>
            <button id="btn-char" class="btn btn-small">Ninja &amp; jutsus (C)</button>
            <button id="btn-save" class="btn btn-small">Sauvegarder</button>
          </div>
          <p class="controls-hint">Déplacement : Z Q S D / flèches · Courir : Maj</p>
        </aside>
      </div>
    </section>

    <!-- Couche des fenêtres modales (village, combat, fiche perso) -->
    <div id="overlay" class="overlay hidden"></div>
  </div>

  <!-- Scripts classiques (aucun bundler) : ordre = dépendances -->
  <script src="js/rng.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/state.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
