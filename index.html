<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow of the Warrior</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05060a;
    color: #e8e2d4;
    font-family: "Trebuchet MS", Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #game-wrap {
    position: relative; width: 900px; height: 640px;
    border-radius: 4px;
    box-shadow: 0 14px 70px rgba(0,0,0,0.95), 0 0 0 2px #17130c, 0 0 0 4px #3a2f1c, 0 0 0 5px #0a0805;
  }
  #pixi, #map2d {
    position: absolute; top: 0; left: 0; width: 900px; height: 640px;
    border-radius: 3px;
  }
  #pixi { z-index: 1; background: #05060a; }
  #map2d { z-index: 2; }
  #hint {
    margin-top: 12px; font-size: 12.5px; color: #7a6f58; letter-spacing: 1px;
    text-align: center; font-family: "Segoe UI", Arial, sans-serif;
  }
  #hint b { color: #c8a24a; }
  #loading {
    position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    background:#05060a; color:#8a7a54; font-size:15px; letter-spacing:2px;
  }
</style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="pixi" width="900" height="640"></canvas>
    <canvas id="map2d" width="900" height="640"></canvas>
    <div id="loading">Invocation des ténèbres…</div>
  </div>
  <div id="hint">
    Déplacement <b>Z Q S D</b> · Interagir <b>E</b> · Combat <b>1-4</b> / <b>↑↓ E</b> · Boutique <b>↑↓ E</b>, <b>X</b>
  </div>

  <script src="libs/pixi.min.js"></script>
  <script src="libs/pixi-filters.js"></script>
  <script src="game.js"></script>
</body>
</html>
