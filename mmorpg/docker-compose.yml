# docker compose de développement — étape T0 du plan de build (§12, §13).
# Services : postgres (vérité durable), redis (état volatile), server (Go).
# Critère de validation T0 : « Le serveur démarre, se connecte à la DB et à Redis. »

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmorpg
      POSTGRES_PASSWORD: mmorpg
      POSTGRES_DB: mmorpg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmorpg -d mmorpg"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://mmorpg:mmorpg@postgres:5432/mmorpg?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      TICK_HZ: "12"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
