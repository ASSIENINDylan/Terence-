name: Build Windows .exe

# Compile le jeu en application Windows (.exe) sur une machine Windows,
# puis met le fichier à disposition en téléchargement.
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:   # permet de lancer la compilation manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Compiler l'application (zip décompressé, sans auto-extraction)
        run: npm run dist:win

      - name: Publier l'application (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: ShadowOfTheWarrior-Windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Créer une Release (uniquement sur un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
